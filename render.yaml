services:
  - type: web
    name: raillink
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: MAPTILER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_MAPTILER_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
