services:
  # -------------------------------------------------------------
  # OPTION 1: Full-Stack Unified Web Service (Express + React SPA)
  # -------------------------------------------------------------
  - type: web
    name: raillink-app
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: MAPTILER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_API_URL
        value: /api
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_MAPTILER_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false

  # -------------------------------------------------------------
  # OPTION 2: Frontend-Only Static Site (If deployed as Static Site)
  # -------------------------------------------------------------
  - type: web
    name: raillink-static-ui
    env: static
    plan: free
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_MAPTILER_API_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
